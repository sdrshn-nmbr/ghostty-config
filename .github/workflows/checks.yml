name: checks
on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when a file asks for it
        run: |
          if grep -rIl --exclude-dir=.git --exclude-dir=.github "FAIL_CHECK" .; then
            echo "A file contains FAIL_CHECK"; exit 1
          fi
